# SonarCloud analysis for the project: the C++ / Objective-C++ app, the build
# and release scripts, the CI workflows, the website and the Android packaging.
#
# sonar.organization and sonar.projectKey identify the project in SonarCloud.
# The SONAR_TOKEN GitHub secret authenticates the scan (see .github/workflows/ci.yml).
sonar.projectKey=rask-project_metronom
sonar.projectName=Metronom
sonar.organization=rask-project

# The new analysis scope UX analyzes the whole project by default (sonar.sources
# has no effect), so the scope is restricted with sonar.exclusions: only the
# generated and non-code content is dropped.
sonar.exclusions=build/**,dist/**,docs/**,translations/**,resources/**,cmake/**,.qtcreator/**
sonar.sourceEncoding=UTF-8

# C++ analysis reads the compilation database that the "sonar" job in
# .github/workflows/ci.yml exports with -DCMAKE_EXPORT_COMPILE_COMMANDS=ON.
# Only the files in that database are analyzed (the generated moc units under
# build/ are excluded above). QML has no Sonar analyzer, so it is not analyzed.
sonar.cfamily.compile-commands=build/sonar/compile_commands.json

# Do not fail the CI job on the quality gate yet: the project has no test
# coverage, so the default gate (new-code coverage >= 80%) would always fail.
# Flip to true once coverage is in place and the code is clean.
sonar.qualitygate.wait=false
