name: Build

# Builds and packages every platform; called by ci.yml and release.yml.
#   macOS   -> arm64 .zip + .dmg (package-macos target), ad-hoc signed
#   Linux   -> .deb (Qt bundled under /opt/metronom)
#   Android -> arm64-v8a .apk + .aab, release-signed when the keystore secrets
#              are set, otherwise a debug build (installable for testing)

on:
  workflow_call:

env:
  QT_VERSION: "6.12.0"
  AQT_VERSION: "==3.3.*"
  ANDROID_NDK_VERSION: "27.2.12479018" # r27c, the NDK Qt 6.12 for Android is built with

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install clang-format==19.1.6
      - run: scripts/format-code.sh -n

  macos:
    name: macOS (arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe --tags for the version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Install tools
        run: brew install ninja

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build/ci

      - name: Package (ad-hoc signed)
        run: |
          cmake --build build/ci --target package-macos
          APP=build/ci/dist/metronom.app
          # The install step prunes unused Qt parts and ad-hoc signs the
          # bundle (cmake/PruneBundle.cmake).
          codesign --verify --deep --strict --verbose=2 "$APP"

          VERSION=$(scripts/ci-version.sh)
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/Metronom-$VERSION-macos-arm64.zip"

          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Rask Metronom" -srcfolder "$STAGE" -ov -format UDZO \
            "out/Metronom-$VERSION-macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: metronom-macos
          path: out/*
          retention-days: 14

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev libdbus-1-dev

      - name: Configure
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/metronom

      - name: Build
        run: cmake --build build/ci

      - name: Package
        run: |
          VERSION=$(scripts/ci-version.sh)
          (cd build/ci && cpack -G DEB)
          mkdir -p out
          mv build/ci/*.deb "out/Metronom-$VERSION-linux-amd64.deb"
          dpkg-deb --info out/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: metronom-linux
          path: out/*
          retention-days: 14

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os # Qt >= 6.7 publishes Android under all_os
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          extra: --autodesktop # host Qt for the build tools
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" > /dev/null

      - name: Configure
        run: |
          SIGN_ARGS=(-DCMAKE_BUILD_TYPE=Debug)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            SIGN_ARGS=(-DCMAKE_BUILD_TYPE=Release -DQT_ANDROID_SIGN_APK=ON -DQT_ANDROID_SIGN_AAB=ON)
          else
            echo "::warning::Android keystore secrets are not set: building a debug-signed APK."
          fi
          HOST_QT="${QT_HOST_PATH:-$(dirname "$QT_ROOT_DIR")/gcc_64}"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/ci -G Ninja \
            -DQT_HOST_PATH="$HOST_QT" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" \
            "${SIGN_ARGS[@]}"

      - name: Build
        # One at a time: both run Gradle in the same android-build directory.
        run: |
          cmake --build build/ci --target apk
          cmake --build build/ci --target aab

      - name: Package
        run: |
          VERSION=$(scripts/ci-version.sh)
          SUFFIX=$([ -n "$ANDROID_KEYSTORE_BASE64" ] && echo "" || echo "-debug")
          mkdir -p out
          APK=$(find build/ci -path '*/outputs/apk/*' -name '*.apk' | head -n 1)
          AAB=$(find build/ci -path '*/outputs/bundle/*' -name '*.aab' | head -n 1)
          cp "$APK" "out/Metronom-$VERSION-android-arm64-v8a$SUFFIX.apk"
          cp "$AAB" "out/Metronom-$VERSION-android-arm64-v8a$SUFFIX.aab"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: metronom-android
          path: out/*
          retention-days: 14
