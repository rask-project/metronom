  notes_after: "Si la figure choisie ne convient pas à la nouvelle mesure, l’app prend la plus longue qui convient. Les icônes ont des têtes de note pleines, comme en notation standard."
  notes_alt: "Jouant du 6/8 : de la noire pointée à la croche (3 par temps) et à la double-croche (6 par temps)"
  bar_text: "À côté de la mesure, la <strong>barre des temps</strong> dessine toute la mesure : un groupe par temps, une case par note de ce temps. Le premier temps a sa propre couleur, et la note jouée s’allume."
  bar_label: "Une mesure à 4/4 en croches : quatre groupes de deux cases, le premier mis en valeur"
  bar_pendulum: "Le <strong>pendule</strong> oscille une fois par temps — pas à chaque clic — pour que l’œil suive la pulsation pendant que l’oreille entend les subdivisions."
  bar_alt: "La barre des temps divisant chaque temps en 2, 4 et 8 cases à mesure que la division change"
  sound_text: "Trois clics vous disent où vous en êtes dans la mesure sans regarder :"
  sound_rows:
    - ["Accent", "Le premier temps de la mesure — le clic le plus aigu et le plus fort"]
    - ["Temps", "Les autres temps"]
