guide:
  eyebrow: "Mode d’emploi"
  title: "Tempo, mesure et division rythmique"
  lead: "Trois réglages font chaque clic : la vitesse du temps, la façon dont les temps se groupent en mesures et la façon dont chaque temps est divisé. Voici ce que chacun signifie et comment ils s’articulent."
  quick_title: "Démarrage rapide"
  quick_steps:
    - "<strong>Choisissez la division rythmique</strong> dans la rangée du haut : %quarter% pour un clic par temps, %eighth% pour deux, et ainsi de suite."
    - "<strong>Réglez le tempo</strong> sur la roue des BPM, ou sautez entre les indications avec les doubles flèches."
    - "<strong>Choisissez la mesure</strong> avec le bouton à côté de la lecture — 4/4 si vous hésitez."
    - "<strong>Lancez la lecture</strong> %play% ou <kbd>Espace</kbd>. Le premier temps de chaque mesure est accentué."
  quick_after: "Tout peut changer pendant la lecture : un nouveau tempo, une nouvelle mesure ou division commence au temps suivant, le compte n’est jamais rompu."
  quick_alt: "La fenêtre principale : les figures en haut, la roue des BPM avec l’indication de tempo, le métronome et, en bas, la lecture, la mesure et la barre des temps"
  tempo_title: "1. Tempo (BPM)"
  tempo_text: "Le tempo est la vitesse du <strong>temps</strong> (la pulsation), en <strong>battements par minute</strong>. À 60 BPM, il y a un temps par seconde ; à 120 BPM, deux. Rask Metronom va de 40 à 300 BPM."
  tempo_callout: "<strong>Le BPM compte toujours des temps, pas des clics.</strong> La figure qui fait le temps dépend de la mesure (une noire en 4/4, une noire pointée en 6/8, voir plus bas). Choisir des croches ou des doubles-croches ajoute des clics <em>entre</em> les temps ; le tempo ne change pas."
  tempo_change_title: "Changer le tempo"
  tempo_change:
    - "<strong>La roue :</strong> faites-la glisser ou défiler, un BPM par ligne."
    - "<strong>Les doubles flèches</strong> de chaque côté sautent à l’indication de tempo précédente (gauche) ou suivante (droite)."
    - "<strong>Le clavier :</strong> <kbd>↑</kbd> <kbd>↓</kbd> changent d’un BPM, <kbd>Page préc.</kbd> <kbd>Page suiv.</kbd> d’une indication."
  markings_title: "Indications de tempo"
  markings_text: "Le mot sous « BPM » est l’indication de tempo classique, en italien, pour la vitesse actuelle. Chacune commence au BPM ci-dessous et dure jusqu’à la suivante :"
  tempo_alt: "Tourner la roue des BPM, sauter à Vivace et Presto avec la double flèche droite et revenir avec la gauche"
  meter_title: "2. Mesure"
  meter_text: "La musique groupe les temps en <strong>mesures</strong>. Le chiffrage de la mesure dit comment, avec deux nombres :"
  meter_list:
    - "<strong>Le nombre du haut</strong> est le nombre de temps dans une mesure — de 1 à 12 dans l’app."
    - "<strong>Le nombre du bas</strong> est la figure qui vaut un temps : <strong>2</strong> = %half%, <strong>4</strong> = %quarter%, <strong>8</strong> = %eighth%."
  meter_after: "Ainsi, <strong>3/4</strong> fait trois temps à la noire par mesure (une valse : <em>UN</em>-deux-trois), et <strong>2/2</strong> (« alla breve ») deux temps à la blanche. Le premier temps de chaque mesure reçoit le clic d’<strong>accent</strong> : vous entendez toujours où commence la mesure."
  compound_title: "Mesures composées : 6/8, 9/8 et 12/8"
  compound_text: "Quand le nombre du bas est 8 et celui du haut 6, 9 ou 12, les croches se ressentent par <strong>groupes de trois</strong>. Chaque groupe est un temps, de la durée d’une %dq% — c’est ainsi que les musiciens comptent une gigue ou un blues en 12/8. Rask Metronom les compte de la même façon :"
  compound_head: ["Mesure", "Temps par mesure", "Un temps vaut", "Compté"]
  compound_rows:
    - ["2/4, 3/4, 4/4, 5/4…", "le nombre du haut", "%quarter%", "1 2 3 4"]
    - ["2/2, 3/2…", "le nombre du haut", "%half%", "1 2"]
    - ["3/8, 5/8, 7/8…", "le nombre du haut", "%eighth%", "1 2 3"]
    - ["6/8", "2", "%dq%", "<em>1</em>-et-a <em>2</em>-et-a"]
    - ["9/8", "3", "%dq%", "3 groupes de 3 croches"]
    - ["12/8", "4", "%dq%", "4 groupes de 3 croches"]
  compound_after: "En 6/8, 9/8 et 12/8, le <strong>BPM compte la noire pointée</strong>. 6/8 à 60 BPM fait deux temps par seconde, chacun avec trois croches à l’intérieur. 3/8 se compte en trois temps à la croche."
  meter_alt: "Changer de mesure en jouant : 4/4, puis 3/4 avec trois groupes, puis 6/8 avec deux temps à la noire pointée"
  notes_title: "3. Division rythmique : diviser le temps"
  notes_text: "La division rythmique est le nombre de clics que vous entendez <strong>dans chaque temps</strong>. C’est là que la mesure et les figures se rencontrent : une figure n’est proposée que si un nombre entier d’entre elles tient dans un temps."
  notes_rule: "<strong>Notes par temps = la durée du temps ÷ la durée de la figure.</strong>"
  notes_rule_text: "Une %quarter% vaut 2 croches, 4 doubles-croches ou 8 triples-croches. Une %half% vaut 2 noires, 4 croches ou 8 doubles-croches. Une %dq% vaut 3 croches ou 6 doubles-croches — mais pas un nombre entier de noires, c’est pourquoi la noire n’est pas proposée en 6/8."
  notes_table_intro: "Cela donne ces choix pour chaque type de temps (jusqu’à 8 notes par temps) :"
  notes_head: ["Temps (mesure)", "Figures proposées — notes par temps"]
  notes_fallback: "Quand vous changez de mesure et que votre figure ne convient plus, l’app passe à la figure la plus longue qui convient."
  bar_title: "Lire la barre des temps"
  bar_text: "La barre des temps, en bas de la fenêtre, dessine la mesure exactement ainsi : <strong>un groupe par temps, une case par note</strong>. La grande case au début de chaque groupe est le temps lui-même ; les petites sont les subdivisions. Pendant la lecture, la note jouée s’allume."
  legend: ["Accent — premier temps de la mesure", "Clic du temps", "Subdivision — clic doux"]
  example: "%beats% temps × %n% = %total% clics par mesure"
  example_label: "%sig% en %note% : %beats% groupes de %n% cases"
  caption_44: "4/4 : noire → croche → double-croche → triple-croche"
  caption_68: "6/8 : noire pointée → croche → double-croche"
  alt_44: "4/4 en passant de la noire à la croche, à la double et à la triple-croche"
  alt_68: "6/8 en passant de la noire pointée à la croche et à la double-croche"
  try_title: "Essayez"
  try_text: "Choisissez une mesure, une division rythmique et un tempo pour voir la mesure que joue l’app et combien de clics vous entendrez — puis lancez la lecture pour l’écouter dans le navigateur."
  try_beats: "Temps par mesure"
  try_note: "Figure du temps"
  try_noscript: "(Le simulateur a besoin de JavaScript.)"
  score_title: "Quand la partition compte une autre figure"
  score_text: "L’indication de tempo d’une partition nomme la figure qu’elle compte, et ce n’est pas toujours le temps de l’app. Convertissez selon le nombre de ces figures dans un temps :"
  score_list:
    - "<strong>6/8 marqué ♪ = 180 :</strong> une noire pointée vaut 3 croches, réglez donc <strong>180 ÷ 3 = 60</strong> BPM et choisissez %eighth% pour entendre chaque croche."
    - "<strong>2/2 marqué ♩ = 160 :</strong> une blanche vaut 2 noires, réglez donc <strong>160 ÷ 2 = 80</strong> BPM et choisissez %quarter%."
    - "<strong>4/4 marqué ♪ = 140 :</strong> réglez <strong>70</strong> BPM avec %eighth% — ou 140 avec %quarter% si vous préférez sentir les croches comme des temps."
  practice_title: "4. Travailler jusqu’au tempo"
  practice_text: "Commencez un passage difficile à un tempo que vous jouez proprement, puis laissez le métronome vous pousser :"
  practice_steps:
    - "Ouvrez les <strong>Paramètres</strong> %gear% et activez l’<strong>Augmentation automatique du BPM</strong>."
    - "Choisissez l’<strong>intervalle</strong> : 30 secondes, 1, 2, 5 ou 10 minutes."
    - "Jouez. À chaque intervalle, le tempo passe à l’<strong>indication suivante</strong> — Andante 76 → Moderato 108 → Allegro 120… — jusqu’à Prestissimo. Le décompte n’avance que pendant la lecture."
  practice_after: "Pour monter plus doucement, laissez l’augmentation automatique désactivée et appuyez sur <kbd>↑</kbd> quelques BPM à la fois entre les répétitions."
  practice_alt: "Activer l’augmentation automatique dans les Paramètres affiche le curseur d’intervalle, réglé sur une minute"
  remember_title: "5. La prochaine fois"
  remember_text: "Avec <strong>Enregistrer le BPM, la mesure et la division rythmique</strong> activé (par défaut), l’app s’ouvre là où vous l’avez laissée. Désactivez-le dans les Paramètres pour toujours commencer à 120 BPM en 4/4."

