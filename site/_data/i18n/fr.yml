  tempo_text: "La roue des BPM règle le tempo de <strong>40 à 300 battements par minute</strong>. Sous le BPM, le nom de l’indication de tempo suit le nombre."
  tempo_rows:
    - ["Faire glisser ou défiler la roue", "Réglage fin, un BPM par ligne"]
    - ["%up% Double flèche gauche", "L’indication de tempo précédente (plus lente)"]
    - ["%down% Double flèche droite", "L’indication de tempo suivante (plus rapide)"]
