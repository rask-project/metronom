  tempo_alt: "Tourner la roue des BPM puis sauter entre les indications de tempo avec les doubles flèches"
  meter_text: "La mesure est le bouton à côté de la lecture. Il ouvre deux roues : les <strong>temps par mesure</strong> (1 à 12) et la <strong>figure qui vaut un temps</strong> (2 = blanche, 4 = noire, 8 = croche)."
  meter_list:
    - "<strong>Les mesures composées</strong> — 6/8, 9/8 et 12/8 — se comptent en noires pointées, chacune partagée en trois croches : 2, 3 et 4 temps par mesure. Le BPM compte la noire pointée."
    - "<strong>Les changements faits en jouant</strong> commencent au temps suivant : le compte n’est jamais rompu."
  meter_alt_dark: "La fenêtre Mesure en thème sombre, réglée sur 4/4"
  meter_alt_light: "La fenêtre Mesure en thème clair, réglée sur 4/4"
  notes_text: "La rangée de notes en haut choisit comment chaque temps est divisé. Seules les figures qui conviennent au temps de la mesure actuelle sont affichées :"
  notes_rows:
    - ["x/2 (temps à la blanche)", "Blanche, noire, croche, double-croche"]
