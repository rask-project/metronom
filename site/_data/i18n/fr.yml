  sound_output: "Choisissez la <strong>sortie audio</strong> dans les Paramètres : haut-parleurs, casque ou interface audio. Changer de périphérique en jouant continue sans trou dans le compte."
  timing_text: "Rask Metronom n’utilise pas de minuteur pour cliquer. Chaque clic est placé sur un échantillon exact du flux audio, compté sur l’horloge de la carte son elle-même : aucune dérive entre le temps et ce que vous entendez, à tout tempo et sur toute durée."
