home:
  badge: "Les mesures, c’est nouveau ? Lisez le mode d’emploi"
  title: "Gardez le tempo. Sentez chaque temps."
  lead: "Rask Metronom est un métronome libre et open source pour macOS, Linux et Android : des clics précis à l’échantillon près, des mesures de 1/2 à 12/8 et des subdivisions qui partagent chaque temps comme vous le comptez."
  download: "Télécharger"
  guide: "Mode d’emploi"
  note: "Libre et open source · macOS 14.4+ · Linux · Android"
  version: "Version %v · "
  alt_light: "Rask Metronom en thème clair, jouant du 4/4 en croches à 120 BPM"
  alt_playing: "Rask Metronom jouant du 4/4 à 120 BPM : le pendule oscille une fois par temps et la barre des temps s’allume temps après temps, le bureau flou à travers la fenêtre"
  alt_settings: "Les Paramètres en thème sombre sur la fenêtre floutée"
  grid_eyebrow: "Tout ce qu’une séance de travail demande"
  grid_title: "Simple en surface. Précis en profondeur."
  grid_lead: "Choisissez un tempo, une mesure et une division rythmique, puis lancez la lecture. Le reste ne vous gêne pas."
  cards:
    timing: ["Précision à l’échantillon", "Les clics sont placés sur l’horloge audio, pas sur un minuteur : le temps ne dérive jamais, ni après une minute, ni après une heure."]
    tempo: ["Tempo de 40 à 300 BPM", "Tournez la roue des BPM, avancez d’un BPM à la fois ou sautez entre les indications classiques, de Largo à Prestissimo."]
    meter: ["Mesures", "De 1 à 12 temps sur une blanche, une noire ou une croche. 6/8, 9/8 et 12/8 se comptent en noires pointées, comme les musiciens les ressentent."]
    notes: ["Des subdivisions qui suivent le temps", "Croches, doubles ou triples-croches divisent chaque temps, et seules les figures qui conviennent à la mesure sont proposées."]
    sound: ["Trois clics", "Un accent sur le premier temps de la mesure, un clic moyen sur les autres temps et un clic doux sur les subdivisions."]
    bar: ["Voir la mesure", "La barre des temps montre un groupe par temps avec une case par note, et le pendule oscille une fois par temps."]
    rise: ["Accélérer en travaillant", "L’augmentation automatique passe à l’indication de tempo suivante toutes les 30 secondes à 10 minutes : le passage accélère pendant que vous jouez."]
    native: ["Natif sur chaque plateforme", "Une fenêtre translucide et floutée avec des contrôles natifs sur macOS ; Material sur Linux et Android. Thèmes clair et sombre partout."]
    keyboard: ["Les mains sur l’instrument", "<kbd>Espace</kbd> lance et arrête, <kbd>↑</kbd> <kbd>↓</kbd> changent le BPM, <kbd>Page préc.</kbd> <kbd>Page suiv.</kbd> sautent d’une indication."]
  notes_eyebrow: "Division rythmique"
  notes_title: "Entendez chaque croche. Ou chaque triple-croche."
  notes_text: "La division rythmique partage <em>chaque temps</em>. En 4/4, les croches jouent 2 notes par temps, les doubles-croches 4 et les triples-croches 8 — et la barre des temps montre exactement cela, une case par note."
  notes_list:
