  button: "Download %ext%"
  macos_title: "Install on macOS"
  macos_steps:
    - "Open the <code>.dmg</code> and drag <strong>Rask Metronom</strong> to <strong>Applications</strong>."
    - "The app is not notarized by Apple yet, so Gatekeeper blocks the first launch. Clear the quarantine flag once:"
    - "That is the only time: Rask Metronom updates itself, and updates open without this step."
  macos_or: "or open it, then choose <strong>System Settings ▸ Privacy &amp; Security ▸ Open Anyway</strong>."
  linux_title: "Install on Linux"
