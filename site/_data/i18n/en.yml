footer:
  tagline: "Norwegian for “metronome”."
  note: "Built with Qt Quick and C++23 for macOS, Linux and Android. Open source under the MIT License on <a href=\"https://github.com/rask-project/metronom\">GitHub</a>."

# Note values in running text (lower case) and as the app labels them.
notes:
  half: "half"
  dq: "dotted quarter"
  quarter: "quarter"
  eighth: "eighth"
  sixteenth: "sixteenth"
  thirtysecond: "thirty-second"
labels:
  half: "Half"
  dq: "Dotted quarter"
  quarter: "Quarter"
  eighth: "Eighth"
  sixteenth: "Sixteenth"
  thirtysecond: "Thirty-second"

markings:
  - ["Largo", "40 · very slow, broad"]
  - ["Larghetto", "60 · rather broad"]
  - ["Adagio", "66 · slow, at ease"]
  - ["Andante", "76 · at a walking pace"]
  - ["Moderato", "108 · moderate"]
  - ["Allegro", "120 · fast, lively"]
  - ["Vivace", "168 · very lively"]
  - ["Presto", "184 · very fast"]
  - ["Prestissimo", "208 · as fast as possible"]

# Used by assets/js/site.js. {placeholders} are filled in by the script.
js:
  copy: "Copy"
  copied: "Copied"
  play: "Play"
  stop: "Stop"
  per_beat: "{n}/beat"
  beats: ["beat", "beats"]
  clicks: ["click", "clicks"]
  result: "<strong>{sig}</strong> has {beats} per bar, each a <strong>{beat}</strong>{compound}. {label}: <strong>{perBeat} per beat</strong>, {clicks} per bar. At {bpm} BPM that is {perMinute} clicks per minute ({perSecond} per second)."
  compound: " (three eighths)"
  bar_label: "{sig} in {note}: {beats} groups of {perBeat} cells"
  no_audio: "This browser cannot play sound."

home:
  badge: "New to time signatures? Read how to use it"
  title: "Keep time. Feel every beat."
  lead: "Rask Metronom is a free, open-source metronome for macOS, Linux and Android: sample-accurate clicks, time signatures from 1/2 to 12/8, and subdivisions that split each beat the way you count it."
  download: "Download"
  guide: "How to use"
  note: "Free and open source · macOS 14.4+ · Linux · Android"
  version: "Version %v · "
  alt_light: "Rask Metronom in the light theme, playing 4/4 in eighth notes at 120 BPM"
  alt_playing: "Rask Metronom playing 4/4 at 120 BPM: the pendulum swings once per beat and the beat bar lights up beat by beat, the desktop showing blurred through the window"
  alt_settings: "The Settings dialog in the dark theme over the blurred window"
  grid_eyebrow: "Everything a practice session needs"
  grid_title: "Simple on the surface. Precise underneath."
  grid_lead: "Pick a tempo, a time signature and a note value, then press play. The rest stays out of your way."
  cards:
    timing: ["Sample-accurate timing", "Clicks are scheduled against the audio clock, not a timer, so the beat never drifts — not after a minute, not after an hour."]
    tempo: ["Tempo from 40 to 300 BPM", "Spin the BPM wheel, step one BPM at a time, or jump between the classic markings from Largo to Prestissimo."]
    meter: ["Time signatures", "1 to 12 beats over a half, quarter or eighth note. 6/8, 9/8 and 12/8 are counted in dotted quarters, like musicians feel them."]
    notes: ["Subdivisions that follow the beat", "Eighths, sixteenths or thirty-seconds divide each beat, and only the note values that fit the time signature are offered."]
    sound: ["Three clicks", "An accent on the first beat of the bar, a medium click on the other beats and a soft click on the subdivisions."]
    bar: ["See the bar", "The beat bar shows one group per beat with a cell per note, and the pendulum swings once per beat."]
    rise: ["Speed up as you practise", "Auto-increment moves to the next tempo marking every 30 seconds to 10 minutes, so a passage gets faster as you play it."]
    native: ["Native on every platform", "A see-through, blurred window and native controls on macOS; Material on Linux and Android. Light and dark themes everywhere."]
    keyboard: ["Hands on the instrument", "<kbd>Space</kbd> plays and stops, <kbd>↑</kbd> <kbd>↓</kbd> change the BPM, <kbd>Page Up</kbd> <kbd>Page Down</kbd> jump between markings."]
