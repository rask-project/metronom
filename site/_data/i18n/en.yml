guide:
  eyebrow: "How to use"
  title: "Tempo, time signature and note value"
  lead: "Three settings make every click: how fast the beat goes, how the beats group into bars, and how each beat is divided. Here is what each one means and how they fit together."
  quick_title: "Quick start"
  quick_steps:
    - "<strong>Pick a note value</strong> in the row at the top: %quarter% for one click per beat, %eighth% for two, and so on."
    - "<strong>Set the tempo</strong> on the BPM wheel, or jump between markings with the double arrows."
    - "<strong>Choose the time signature</strong> with the button next to play — 4/4 if you are not sure."
    - "<strong>Press play</strong> %play% or <kbd>Space</kbd>. The first beat of each bar is accented."
  quick_after: "Everything can change while it plays: a new tempo, time signature or note value starts on the next beat, so the count never breaks."
  quick_alt: "The main window: note values at the top, the BPM wheel with the tempo marking, the metronome, and at the bottom play, the time signature and the beat bar"
  tempo_title: "1. Tempo (BPM)"
  tempo_text: "The tempo is the speed of the <strong>beat</strong>, in <strong>beats per minute</strong>. At 60 BPM there is one beat per second; at 120 BPM, two. Rask Metronom goes from 40 to 300 BPM."
  tempo_callout: "<strong>The BPM always counts beats — not clicks.</strong> Which note is the beat depends on the time signature (a quarter in 4/4, a dotted quarter in 6/8, see below). Choosing eighths or sixteenths adds clicks <em>between</em> the beats; the tempo does not change."
  tempo_change_title: "Changing the tempo"
  tempo_change:
    - "<strong>The wheel:</strong> drag it or scroll over it, one BPM per row."
    - "<strong>The double arrows</strong> on each side jump to the previous (left) or next (right) tempo marking."
    - "<strong>The keyboard:</strong> <kbd>↑</kbd> <kbd>↓</kbd> change one BPM, <kbd>Page Up</kbd> <kbd>Page Down</kbd> jump one marking."
  markings_title: "Tempo markings"
  markings_text: "The word under “BPM” is the classic Italian tempo marking for the current speed. Each one starts at the BPM below and lasts until the next:"
  tempo_alt: "Turning the BPM wheel, then jumping to Vivace and Presto with the right double arrow and back with the left one"
  meter_title: "2. Time signature"
  meter_text: "Music groups beats into <strong>bars</strong> (measures). The time signature says how, with two numbers:"
  meter_list:
    - "<strong>The top number</strong> is how many beats there are in a bar — 1 to 12 in the app."
    - "<strong>The bottom number</strong> is the note that gets one beat: <strong>2</strong> = a %half%, <strong>4</strong> = a %quarter%, <strong>8</strong> = an %eighth%."
  meter_after: "So <strong>3/4</strong> is three quarter-note beats per bar (a waltz: <em>ONE</em>-two-three), and <strong>2/2</strong> (“cut time”) is two half-note beats. The first beat of every bar gets the <strong>accent</strong> click, so you always hear where the bar starts."
  compound_title: "Compound meters: 6/8, 9/8 and 12/8"
  compound_text: "When the bottom number is 8 and the top is 6, 9 or 12, the eighths are felt in <strong>groups of three</strong>. Each group is one beat, a %dq% long — that is how musicians count a jig or a 12/8 blues. Rask Metronom counts them the same way:"
  compound_head: ["Time signature", "Beats per bar", "One beat is", "Counted"]
  compound_rows:
    - ["2/4, 3/4, 4/4, 5/4…", "the top number", "%quarter%", "1 2 3 4"]
    - ["2/2, 3/2…", "the top number", "%half%", "1 2"]
    - ["3/8, 5/8, 7/8…", "the top number", "%eighth%", "1 2 3"]
    - ["6/8", "2", "%dq%", "<em>1</em>-and-a <em>2</em>-and-a"]
    - ["9/8", "3", "%dq%", "3 groups of 3 eighths"]
    - ["12/8", "4", "%dq%", "4 groups of 3 eighths"]
  compound_after: "In 6/8, 9/8 and 12/8 the <strong>BPM counts the dotted quarter</strong>. 6/8 at 60 BPM is two beats per second, each with three eighths inside it. 3/8 is counted as three eighth-note beats."
  meter_alt: "Changing the time signature while playing: 4/4, then 3/4 with three beat groups, then 6/8 with two dotted-quarter beats"
  notes_title: "3. Note value: dividing the beat"
  notes_text: "The note value is how many clicks you hear <strong>in each beat</strong>. It is where the time signature and the note values meet: a note value is offered only if a whole number of them fits in one beat."
  notes_rule: "<strong>Notes per beat = the length of the beat ÷ the length of the note.</strong>"
  notes_rule_text: "A %quarter% holds 2 eighths, 4 sixteenths or 8 thirty-seconds. A %half% holds 2 quarters, 4 eighths or 8 sixteenths. A %dq% holds 3 eighths or 6 sixteenths — but not a whole number of quarters, which is why quarters are not offered in 6/8."
  notes_table_intro: "That gives these choices for each kind of beat (up to 8 notes per beat):"
  notes_head: ["Beat (time signature)", "Note values offered — notes per beat"]
  notes_fallback: "When you change the time signature and your note value no longer fits, the app switches to the longest note value that does."
  bar_title: "Reading the beat bar"
  bar_text: "The beat bar at the bottom of the window draws the bar exactly like this: <strong>one group per beat, one cell per note</strong>. The bigger cell at the start of each group is the beat itself; the smaller ones are the subdivisions. As it plays, the current note lights up."
  legend: ["Accent — first beat of the bar", "Beat click", "Subdivision — soft click"]
  example: "%beats% beats × %n% = %total% clicks per bar"
  example_label: "%sig% in %note%: %beats% groups of %n% cells"
  caption_44: "4/4: quarter → eighth → sixteenth → thirty-second"
  caption_68: "6/8: dotted quarter → eighth → sixteenth"
  alt_44: "4/4 while switching from quarter to eighth, sixteenth and thirty-second notes"
  alt_68: "6/8 while switching from dotted quarter to eighth and sixteenth notes"
  try_title: "Try it"
  try_text: "Choose a time signature, a note value and a tempo to see the bar the app plays and how many clicks you will hear — then press play to hear it in your browser."
  try_beats: "Beats per bar"
  try_note: "Beat note"
  try_noscript: "(The explorer needs JavaScript.)"
  score_title: "When the score counts a different note"
  score_text: "A score's tempo mark names the note it counts, and it is not always the app's beat. Convert by the number of those notes in one beat:"
  score_list:
    - "<strong>6/8 marked ♪ = 180:</strong> a dotted quarter holds 3 eighths, so set <strong>180 ÷ 3 = 60</strong> BPM and choose %eighth% to hear every eighth."
    - "<strong>2/2 marked ♩ = 160:</strong> a half holds 2 quarters, so set <strong>160 ÷ 2 = 80</strong> BPM and choose %quarter%."
    - "<strong>4/4 marked ♪ = 140:</strong> set <strong>70</strong> BPM with %eighth% — or 140 with %quarter% if you would rather feel the eighths as beats."
  practice_title: "4. Practising up to speed"
  practice_text: "Start a hard passage at a tempo you can play cleanly, then let the metronome push you:"
  practice_steps:
    - "Open <strong>Settings</strong> %gear% and turn on <strong>Auto-increment BPM</strong>."
    - "Choose the <strong>interval</strong>: 30 seconds, 1, 2, 5 or 10 minutes."
    - "Play. At every interval the tempo moves to the <strong>next tempo marking</strong> — Andante 76 → Moderato 108 → Allegro 120… — until Prestissimo. It only counts while the metronome plays."
  practice_after: "To go up more gently, leave auto-increment off and press <kbd>↑</kbd> a few BPM at a time between repetitions."
  practice_alt: "Turning on auto-increment in Settings shows the interval slider, set to one minute"
  remember_title: "5. Next time"
  remember_text: "With <strong>Save the BPM, time signature and note value</strong> on (the default), the app opens where you left it. Turn it off in Settings to always start at 120 BPM in 4/4."

download:
  eyebrow: "Download"
  title: "Get Rask Metronom"
  lead: "Free and open source."
  version: "The latest version is %v."
  macos_text: "A disk image with the app. Signed updates from then on."
  macos_meta: ["macOS 14.4 or later", "Apple Silicon"]
  linux_text: "A Debian package with Qt included, installed under <code>/opt/metronom</code>."
