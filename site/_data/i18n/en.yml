  meter_title: "From a waltz to 12/8 blues."
  meter_text: "Tap the time signature next to play and turn the wheels: 1 to 12 beats over a half, quarter or eighth note."
  meter_list:
    - "<strong>Compound meters</strong> — 6/8, 9/8 and 12/8 — are counted in dotted quarters, each split in three eighths."
    - "<strong>The first beat is accented</strong>, so you always know where the bar starts."
  meter_link: "Reading a time signature →"
  meter_alt: "Changing the time signature while playing: from 4/4 to 3/4, then to 6/8, where the note values become dotted quarter, eighth and sixteenth"
  tempo_eyebrow: "Tempo"
