    - ["<kbd>⌘W</kbd> or <kbd>⌘Q</kbd>", "Quit (macOS)"]
  appearance_text: "<strong>Light or dark</strong>, chosen in Settings, independent of the system. Dialogs have a border and a shadow over a blurred, slightly dimmed page."
  appearance_native: "On <strong>macOS</strong> the window is translucent and blurred, with the content running under the title bar, and uses native controls tinted with the app's orange. On <strong>Linux and Android</strong> it uses Material. The layout adapts to portrait and landscape: on a phone in landscape the metronome takes the left side and the controls stack on the right."
  appearance_alt_dark: "The main window in the dark theme, playing 4/4 in eighths, the desktop blurred through it"
  appearance_alt_light: "The main window in the light theme, playing 4/4 in eighths"
  settings_rows:
    - ["Dark mode", "Light or dark theme"]
    - ["Save the BPM, time signature and note value", "Restores them on the next launch (on by default)"]
    - ["Auto-increment BPM", "Next tempo marking at every interval"]
    - ["Language", "English, Português (Brasil), Español, Français, Italiano; applied on the next launch"]
    - ["Output", "The audio device to play on"]
  settings_alt_dark: "Settings in the dark theme"
  settings_alt_light: "Settings in the light theme"
