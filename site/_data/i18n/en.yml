features:
  eyebrow: "Features"
  title: "Everything Rask Metronom does"
  lead: "A tour of the app, laid out like a Settings window. For the music behind it — tempo, time signatures and note values — see <a href=\"%base%guide/\">How to use</a>."
  sidebar:
    tempo: "Tempo"
    meter: "Time Signature"
    notes: "Note Values"
    bar: "Beat Bar & Pendulum"
    sound: "Sound"
    timing: "Timing"
    rise: "Auto-increment"
    keyboard: "Keyboard"
    appearance: "Appearance"
    settings: "Settings"
    platforms: "Platforms"
    updates: "Updates"
  tempo_text: "The BPM wheel sets the tempo from <strong>40 to 300 beats per minute</strong>. Under the BPM, the name of the tempo marking follows the number."
  tempo_rows:
    - ["Drag or scroll the wheel", "Fine changes, one BPM per row"]
    - ["%up% Left double arrow", "The previous (slower) tempo marking"]
    - ["%down% Right double arrow", "The next (faster) tempo marking"]
  tempo_markings: "The markings are Largo 40, Larghetto 60, Adagio 66, Andante 76, Moderato 108, Allegro 120, Vivace 168, Presto 184 and Prestissimo 208."
  tempo_alt: "Turning the BPM wheel, then jumping between tempo markings with the double arrows"
  meter_text: "The time signature is the button next to play. It opens two wheels: the <strong>beats per bar</strong> (1 to 12) and the <strong>note that gets the beat</strong> (2 = half, 4 = quarter, 8 = eighth)."
  meter_list:
    - "<strong>Compound meters</strong> — 6/8, 9/8 and 12/8 — are counted in dotted quarters, each split in three eighths: 2, 3 and 4 beats per bar. The BPM counts the dotted quarter."
    - "<strong>Changes made while playing</strong> start on the next beat, so the count never breaks."
  meter_alt_dark: "The Time signature dialog in the dark theme, set to 4/4"
  meter_alt_light: "The Time signature dialog in the light theme, set to 4/4"
  notes_text: "The row of notes at the top chooses how each beat is divided. Only the note values that fit the beat of the current time signature are shown:"
  notes_rows:
    - ["x/2 (half-note beat)", "Half, quarter, eighth, sixteenth"]
    - ["x/4 (quarter-note beat)", "Quarter, eighth, sixteenth, thirty-second"]
    - ["x/8 (eighth-note beat)", "Eighth, sixteenth, thirty-second"]
    - ["6/8, 9/8, 12/8 (dotted quarter)", "Dotted quarter, eighth, sixteenth"]
  notes_after: "If the note value you had does not fit a new time signature, the app picks the longest one that does. Note icons use filled note heads, as in standard notation."
  notes_alt: "Playing 6/8: switching from dotted quarter to eighth (3 per beat) and sixteenth (6 per beat)"
  bar_text: "Next to the time signature, the <strong>beat bar</strong> draws the whole bar: one group per beat, one cell per note in that beat. The first beat has its own colour, and the note being played lights up."
  bar_label: "A 4/4 bar in eighth notes: four groups of two cells, the first group highlighted"
  bar_pendulum: "The <strong>pendulum</strong> swings once per beat — not on every click — so your eye follows the pulse while your ear hears the subdivisions."
  bar_alt: "The beat bar splitting each beat into 2, 4 and 8 cells as the note value changes"
  sound_text: "Three clicks tell you where you are in the bar without looking:"
  sound_rows:
    - ["Accent", "The first beat of the bar — the highest and loudest click"]
    - ["Beat", "The other beats"]
    - ["Subdivision", "The notes between the beats — a soft click"]
  sound_output: "Choose the <strong>audio output</strong> in Settings: speakers, headphones or an audio interface. Switching devices while playing carries on without a gap in the count."
  timing_text: "Rask Metronom does not use a timer to click. Every click is placed at an exact sample of the audio stream, counted against the sound card's own clock, so there is no drift between the beat and what you hear, at any tempo and for any length of time."
  timing_list:
    - "Clicks are rendered once and mixed in; the audio path does no allocation and takes no locks."
    - "While the metronome plays, <strong>the screen stays awake</strong> on macOS, Linux (X11 and Wayland) and Android."
  rise_text: "For working a passage up to speed: turn on <strong>Auto-increment BPM</strong> in Settings and choose an interval. While the metronome plays, each interval moves the tempo to the <strong>next tempo marking</strong> — for example Moderato 108 → Allegro 120 → Vivace 168 — until Prestissimo."
  rise_rows:
    - ["Interval", "30 seconds, 1, 2, 5 or 10 minutes"]
  rise_alt: "Turning on auto-increment in Settings shows the interval slider"
  keyboard_rows:
    - ["<kbd>Space</kbd>", "Play / stop"]
    - ["<kbd>↑</kbd> / <kbd>↓</kbd>", "BPM up / down by one"]
    - ["<kbd>Page Up</kbd> / <kbd>Page Down</kbd>", "Next / previous tempo marking"]
