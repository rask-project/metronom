  android_title: "Install on Android"
  android_after: "Open the <code>.apk</code> on the device and allow installing from your browser or file manager when Android asks."
  source_title: "Build from source"
  source_text: "You need Qt 6.10 or later (Quick, Quick Controls 2, Multimedia), CMake and a C++23 compiler."
  source_after: "The <a href=\"https://github.com/rask-project/metronom#readme\">README</a> covers the architecture, and <a href=\"https://github.com/rask-project/metronom/releases\">all releases</a> are on GitHub."

