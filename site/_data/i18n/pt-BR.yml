home:
  badge: "Começando com compassos? Veja como usar"
  title: "Mantenha o tempo. Sinta cada batida."
  lead: "O Metronom é um metrônomo livre e de código aberto para macOS, Linux e Android: cliques com precisão de amostra, compassos de 1/2 a 12/8 e divisões que repartem cada tempo do jeito que você conta."
  download: "Download"
  guide: "Como usar"
  note: "Livre e de código aberto · macOS 14.4+ · Linux · Android"
  version: "Versão %v · "
  alt_light: "Metronom no tema claro, tocando 4/4 em colcheias a 120 BPM"
  alt_playing: "Metronom tocando 4/4 a 120 BPM: o pêndulo balança uma vez por tempo e a barra de tempos acende tempo a tempo, com a área de trabalho desfocada através da janela"
  alt_settings: "As Configurações no tema escuro sobre a janela desfocada"
  grid_eyebrow: "Tudo o que um estudo precisa"
  grid_title: "Simples por fora. Preciso por dentro."
  grid_lead: "Escolha o andamento, o compasso e a divisão rítmica e aperte play. O resto não atrapalha."
  cards:
    timing: ["Precisão de amostra", "Os cliques são agendados no relógio do áudio, não num timer, então o tempo nunca escorrega — nem depois de um minuto, nem depois de uma hora."]
    tempo: ["Andamento de 40 a 300 BPM", "Gire a roda de BPM, ajuste de um em um ou salte entre as indicações clássicas, de Largo a Prestissimo."]
    meter: ["Compassos", "De 1 a 12 tempos sobre mínima, semínima ou colcheia. 6/8, 9/8 e 12/8 são contados em semínimas pontuadas, como os músicos sentem."]
    notes: ["Divisões que seguem o tempo", "Colcheias, semicolcheias ou fusas dividem cada tempo, e só aparecem as figuras que cabem no compasso."]
    sound: ["Três cliques", "Um acento no primeiro tempo do compasso, um clique médio nos outros tempos e um clique suave nas subdivisões."]
    bar: ["Veja o compasso", "A barra de tempos mostra um grupo por tempo com uma célula por nota, e o pêndulo balança uma vez por tempo."]
    rise: ["Acelere enquanto estuda", "O aumento automático passa para a próxima indicação de andamento a cada 30 segundos a 10 minutos, e o trecho fica mais rápido enquanto você toca."]
