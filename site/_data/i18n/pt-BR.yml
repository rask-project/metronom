  updates_text: "No macOS, uma vez por dia o Metronom procura uma versão nova, baixa em segundo plano e instala quando você sai. <strong>Metronom ▸ Check for Updates…</strong> verifica na hora e mostra o que mudou. As atualizações são assinadas."

guide:
  eyebrow: "Como usar"
  title: "Andamento, compasso e divisão rítmica"
  lead: "Três ajustes formam cada clique: a velocidade do tempo, como os tempos se agrupam em compassos e como cada tempo é dividido. Veja o que cada um significa e como eles se encaixam."
  quick_title: "Começo rápido"
  quick_steps:
    - "<strong>Escolha a divisão rítmica</strong> na fileira do topo: %quarter% para um clique por tempo, %eighth% para dois, e assim por diante."
    - "<strong>Ajuste o andamento</strong> na roda de BPM, ou salte entre as indicações com as setas duplas."
    - "<strong>Escolha o compasso</strong> no botão ao lado do play — 4/4 se estiver em dúvida."
    - "<strong>Aperte play</strong> %play% ou <kbd>Espaço</kbd>. O primeiro tempo de cada compasso é acentuado."
  quick_after: "Tudo pode mudar enquanto toca: um novo andamento, compasso ou divisão começa no próximo tempo, então a contagem nunca quebra."
  quick_alt: "A janela principal: as figuras no topo, a roda de BPM com a indicação de andamento, o metrônomo e, embaixo, o play, o compasso e a barra de tempos"
  tempo_title: "1. Andamento (BPM)"
  tempo_text: "O andamento é a velocidade do <strong>tempo</strong> (a pulsação), em <strong>batidas por minuto</strong>. A 60 BPM há um tempo por segundo; a 120 BPM, dois. O Metronom vai de 40 a 300 BPM."
  tempo_callout: "<strong>O BPM sempre conta tempos — não cliques.</strong> Qual figura vale um tempo depende do compasso (semínima em 4/4, semínima pontuada em 6/8, veja abaixo). Escolher colcheias ou semicolcheias acrescenta cliques <em>entre</em> os tempos; o andamento não muda."
  tempo_change_title: "Mudando o andamento"
  tempo_change:
    - "<strong>A roda:</strong> arraste ou role sobre ela, um BPM por linha."
    - "<strong>As setas duplas</strong> dos lados saltam para a indicação de andamento anterior (esquerda) ou seguinte (direita)."
    - "<strong>O teclado:</strong> <kbd>↑</kbd> <kbd>↓</kbd> mudam um BPM, <kbd>Page Up</kbd> <kbd>Page Down</kbd> saltam uma indicação."
  markings_title: "Indicações de andamento"
  markings_text: "A palavra embaixo de “BPM” é a indicação clássica, em italiano, para a velocidade atual. Cada uma começa no BPM abaixo e vai até a seguinte:"
  tempo_alt: "Girando a roda de BPM, saltando para Vivace e Presto com a seta dupla da direita e voltando com a da esquerda"
  meter_title: "2. Compasso"
  meter_text: "A música agrupa os tempos em <strong>compassos</strong>. A fórmula de compasso diz como, com dois números:"
  meter_list:
    - "<strong>O número de cima</strong> é quantos tempos há num compasso — de 1 a 12 no app."
    - "<strong>O número de baixo</strong> é a figura que vale um tempo: <strong>2</strong> = %half%, <strong>4</strong> = %quarter%, <strong>8</strong> = %eighth%."
  meter_after: "Então <strong>3/4</strong> são três tempos de semínima por compasso (uma valsa: <em>UM</em>-dois-três), e <strong>2/2</strong> (“compasso alla breve”) são dois tempos de mínima. O primeiro tempo de cada compasso recebe o clique de <strong>acento</strong>, então você sempre ouve onde o compasso começa."
  compound_title: "Compassos compostos: 6/8, 9/8 e 12/8"
  compound_text: "Quando o número de baixo é 8 e o de cima é 6, 9 ou 12, as colcheias são sentidas em <strong>grupos de três</strong>. Cada grupo é um tempo, com a duração de uma %dq% — é assim que os músicos contam uma tarantela ou um blues em 12/8. O Metronom conta do mesmo jeito:"
  compound_head: ["Compasso", "Tempos por compasso", "Um tempo vale", "Contagem"]
  compound_rows:
    - ["2/4, 3/4, 4/4, 5/4…", "o número de cima", "%quarter%", "1 2 3 4"]
    - ["2/2, 3/2…", "o número de cima", "%half%", "1 2"]
    - ["3/8, 5/8, 7/8…", "o número de cima", "%eighth%", "1 2 3"]
    - ["6/8", "2", "%dq%", "<em>1</em>-e-a <em>2</em>-e-a"]
    - ["9/8", "3", "%dq%", "3 grupos de 3 colcheias"]
    - ["12/8", "4", "%dq%", "4 grupos de 3 colcheias"]
  compound_after: "Em 6/8, 9/8 e 12/8 o <strong>BPM conta a semínima pontuada</strong>. 6/8 a 60 BPM são dois tempos por segundo, cada um com três colcheias dentro. 3/8 é contado como três tempos de colcheia."
  meter_alt: "Mudando o compasso tocando: 4/4, depois 3/4 com três grupos e depois 6/8 com dois tempos de semínima pontuada"
  notes_title: "3. Divisão rítmica: dividindo o tempo"
  notes_text: "A divisão rítmica é quantos cliques você ouve <strong>em cada tempo</strong>. É aqui que o compasso e as figuras se encontram: uma figura só é oferecida se um número inteiro delas cabe num tempo."
  notes_rule: "<strong>Notas por tempo = a duração do tempo ÷ a duração da figura.</strong>"
  notes_rule_text: "Uma %quarter% vale 2 colcheias, 4 semicolcheias ou 8 fusas. Uma %half% vale 2 semínimas, 4 colcheias ou 8 semicolcheias. Uma %dq% vale 3 colcheias ou 6 semicolcheias — mas não um número inteiro de semínimas, e é por isso que a semínima não aparece em 6/8."
  notes_table_intro: "Isso dá estas opções para cada tipo de tempo (até 8 notas por tempo):"
  notes_head: ["Tempo (compasso)", "Figuras oferecidas — notas por tempo"]
  notes_fallback: "Quando você muda o compasso e a figura escolhida não cabe mais, o app troca para a figura mais longa que cabe."
  bar_title: "Lendo a barra de tempos"
  bar_text: "A barra de tempos, embaixo na janela, desenha o compasso exatamente assim: <strong>um grupo por tempo, uma célula por nota</strong>. A célula maior no começo de cada grupo é o próprio tempo; as menores são as subdivisões. Enquanto toca, a nota atual acende."
  legend: ["Acento — primeiro tempo do compasso", "Clique do tempo", "Subdivisão — clique suave"]
  example: "%beats% tempos × %n% = %total% cliques por compasso"
  example_label: "%sig% em %note%: %beats% grupos de %n% células"
  caption_44: "4/4: semínima → colcheia → semicolcheia → fusa"
  caption_68: "6/8: semínima pontuada → colcheia → semicolcheia"
  alt_44: "4/4 trocando de semínima para colcheia, semicolcheia e fusa"
  alt_68: "6/8 trocando de semínima pontuada para colcheia e semicolcheia"
  try_title: "Experimente"
  try_text: "Escolha um compasso, uma divisão rítmica e um andamento para ver o compasso que o app toca e quantos cliques você vai ouvir — e aperte play para ouvir no navegador."
  try_beats: "Tempos por compasso"
  try_note: "Figura do tempo"
  try_noscript: "(O simulador precisa de JavaScript.)"
  score_title: "Quando a partitura conta outra figura"
  score_text: "A indicação de andamento da partitura diz qual figura ela conta, e nem sempre é o tempo do app. Converta pelo número dessas figuras num tempo:"
  score_list:
    - "<strong>6/8 marcado ♪ = 180:</strong> uma semínima pontuada vale 3 colcheias, então ajuste <strong>180 ÷ 3 = 60</strong> BPM e escolha %eighth% para ouvir cada colcheia."
    - "<strong>2/2 marcado ♩ = 160:</strong> uma mínima vale 2 semínimas, então ajuste <strong>160 ÷ 2 = 80</strong> BPM e escolha %quarter%."
    - "<strong>4/4 marcado ♪ = 140:</strong> ajuste <strong>70</strong> BPM com %eighth% — ou 140 com %quarter% se preferir sentir as colcheias como tempos."
  practice_title: "4. Estudando até o andamento"
  practice_text: "Comece um trecho difícil num andamento em que você toca limpo e deixe o metrônomo puxar você:"
  practice_steps:
    - "Abra as <strong>Configurações</strong> %gear% e ligue o <strong>Aumento automático de BPM</strong>."
    - "Escolha o <strong>intervalo</strong>: 30 segundos, 1, 2, 5 ou 10 minutos."
    - "Toque. A cada intervalo o andamento passa para a <strong>próxima indicação</strong> — Andante 76 → Moderato 108 → Allegro 120… — até Prestissimo. Só conta enquanto o metrônomo toca."
  practice_after: "Para subir mais devagar, deixe o aumento automático desligado e aperte <kbd>↑</kbd> alguns BPM por vez entre as repetições."
  practice_alt: "Ligar o aumento automático nas Configurações mostra o controle de intervalo, em um minuto"
  remember_title: "5. Da próxima vez"
  remember_text: "Com <strong>Salvar o BPM, o compasso e a divisão rítmica</strong> ligado (o padrão), o app abre onde você parou. Desligue nas Configurações para começar sempre em 120 BPM e 4/4."

