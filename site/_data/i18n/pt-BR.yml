    keyboard: ["Mãos no instrumento", "<kbd>Espaço</kbd> toca e para, <kbd>↑</kbd> <kbd>↓</kbd> mudam o BPM, <kbd>Page Up</kbd> <kbd>Page Down</kbd> saltam entre as indicações."]
  notes_eyebrow: "Divisão rítmica"
  notes_title: "Ouça cada colcheia. Ou cada fusa."
  notes_text: "A divisão rítmica reparte <em>cada tempo</em>. Em 4/4, colcheias tocam 2 notas por tempo, semicolcheias 4 e fusas 8 — e a barra de tempos mostra exatamente isso, uma célula por nota."
  notes_list:
    - "<strong>O tempo continua sendo o tempo:</strong> o BPM e o pêndulo seguem contando tempos enquanto os cliques preenchem o meio."
    - "<strong>Mude tocando:</strong> a nova divisão começa no próximo tempo, então a contagem nunca quebra."
  notes_link: "Como a divisão rítmica se relaciona com o compasso →"
  notes_alt: "Tocando 4/4 a 120 BPM enquanto troca de semínima para colcheia, semicolcheia e fusa; a barra divide cada tempo em 2, 4 e 8 células"
  meter_eyebrow: "Compassos"
