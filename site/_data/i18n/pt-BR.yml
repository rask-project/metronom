features:
  eyebrow: "Funcionalidades"
  title: "Tudo o que o Metronom faz"
  lead: "Um passeio pelo app. Para a música por trás — andamento, compassos e divisão rítmica — veja <a href=\"%base%guide/\">Como usar</a>."
  menu:
    tempo: "Andamento"
    meter: "Compasso"
    notes: "Divisão rítmica"
    bar: "Barra de tempos e pêndulo"
    sound: "Som"
    timing: "Precisão"
    rise: "Aumento automático"
    keyboard: "Teclado"
    appearance: "Aparência"
    settings: "Configurações"
    platforms: "Plataformas"
    updates: "Atualizações"
  tempo_text: "A roda de BPM define o andamento de <strong>40 a 300 batidas por minuto</strong>. Abaixo do BPM, o nome da indicação de andamento acompanha o número."
  tempo_rows:
    - ["Arrastar ou rolar a roda", "Ajuste fino, um BPM por linha"]
    - ["%up% Seta dupla à esquerda", "A indicação de andamento anterior (mais lenta)"]
    - ["%down% Seta dupla à direita", "A próxima indicação de andamento (mais rápida)"]
  tempo_markings: "As indicações são Largo 40, Larghetto 60, Adagio 66, Andante 76, Moderato 108, Allegro 120, Vivace 168, Presto 184 e Prestissimo 208."
  tempo_alt: "Girando a roda de BPM e saltando entre indicações de andamento com as setas duplas"
  meter_text: "O compasso é o botão ao lado do play. Ele abre duas rodas: os <strong>tempos por compasso</strong> (1 a 12) e a <strong>figura que vale um tempo</strong> (2 = mínima, 4 = semínima, 8 = colcheia)."
  meter_list:
    - "<strong>Compassos compostos</strong> — 6/8, 9/8 e 12/8 — são contados em semínimas pontuadas, cada uma com três colcheias: 2, 3 e 4 tempos por compasso. O BPM conta a semínima pontuada."
    - "<strong>Mudanças feitas tocando</strong> começam no próximo tempo, então a contagem nunca quebra."
  meter_alt_dark: "O diálogo de compasso no tema escuro, em 4/4"
  meter_alt_light: "O diálogo de compasso no tema claro, em 4/4"
  notes_text: "A fileira de notas no topo escolhe como cada tempo é dividido. Só aparecem as figuras que cabem no tempo do compasso atual:"
  notes_rows:
    - ["x/2 (tempo de mínima)", "Mínima, semínima, colcheia, semicolcheia"]
    - ["x/4 (tempo de semínima)", "Semínima, colcheia, semicolcheia, fusa"]
    - ["x/8 (tempo de colcheia)", "Colcheia, semicolcheia, fusa"]
    - ["6/8, 9/8, 12/8 (semínima pontuada)", "Semínima pontuada, colcheia, semicolcheia"]
  notes_after: "Se a figura que você tinha não cabe no novo compasso, o app escolhe a mais longa que cabe. Os ícones usam cabeças de nota preenchidas, como na notação padrão."
  notes_alt: "Tocando 6/8: trocando de semínima pontuada para colcheia (3 por tempo) e semicolcheia (6 por tempo)"
  bar_text: "Ao lado do compasso, a <strong>barra de tempos</strong> desenha o compasso inteiro: um grupo por tempo, uma célula por nota daquele tempo. O primeiro tempo tem cor própria, e a nota que está tocando acende."
  bar_label: "Um compasso 4/4 em colcheias: quatro grupos de duas células, o primeiro destacado"
  bar_pendulum: "O <strong>pêndulo</strong> balança uma vez por tempo — não a cada clique — para o olho acompanhar a pulsação enquanto o ouvido escuta as subdivisões."
  bar_alt: "A barra de tempos dividindo cada tempo em 2, 4 e 8 células conforme a divisão muda"
  sound_text: "Três cliques dizem onde você está no compasso sem precisar olhar:"
  sound_rows:
    - ["Acento", "O primeiro tempo do compasso — o clique mais agudo e mais forte"]
    - ["Tempo", "Os outros tempos"]
    - ["Subdivisão", "As notas entre os tempos — um clique suave"]
  sound_output: "Escolha a <strong>saída de áudio</strong> nas Configurações: alto-falantes, fones ou uma interface de áudio. Trocar de dispositivo tocando continua sem falha na contagem."
  timing_text: "O Metronom não usa um timer para clicar. Cada clique é posto numa amostra exata do fluxo de áudio, contada no relógio da própria placa de som, então não há deriva entre o tempo e o que você ouve, em qualquer andamento e por qualquer duração."
  timing_list:
    - "Os cliques são gerados uma vez e mixados; o caminho do áudio não aloca memória nem usa travas."
    - "Enquanto o metrônomo toca, <strong>a tela continua acesa</strong> no macOS, Linux (X11 e Wayland) e Android."
  rise_text: "Para levar um trecho até o andamento: ligue o <strong>Aumento automático de BPM</strong> nas Configurações e escolha um intervalo. Enquanto o metrônomo toca, cada intervalo leva o andamento à <strong>próxima indicação</strong> — por exemplo Moderato 108 → Allegro 120 → Vivace 168 — até Prestissimo."
  rise_rows:
    - ["Intervalo", "30 segundos, 1, 2, 5 ou 10 minutos"]
  rise_alt: "Ligar o aumento automático nas Configurações mostra o controle de intervalo"
  keyboard_rows:
    - ["<kbd>Espaço</kbd>", "Tocar / parar"]
    - ["<kbd>↑</kbd> / <kbd>↓</kbd>", "BPM mais um / menos um"]
    - ["<kbd>Page Up</kbd> / <kbd>Page Down</kbd>", "Próxima / anterior indicação de andamento"]
    - ["<kbd>⌘,</kbd>", "Configurações (macOS)"]
    - ["<kbd>⌘W</kbd> ou <kbd>⌘Q</kbd>", "Sair (macOS)"]
  appearance_text: "<strong>Claro ou escuro</strong>, escolhido nas Configurações, independente do sistema. Os diálogos têm borda e sombra sobre a página desfocada e levemente escurecida."
  appearance_native: "No <strong>macOS</strong> a janela é translúcida e desfocada, com o conteúdo passando por baixo da barra de título, e usa controles nativos no laranja do app. No <strong>Linux e Android</strong> usa Material. O layout se adapta a retrato e paisagem: num celular deitado, o metrônomo fica à esquerda e os controles se empilham à direita."
  appearance_alt_dark: "A janela principal no tema escuro, tocando 4/4 em colcheias, com a área de trabalho desfocada através dela"
  appearance_alt_light: "A janela principal no tema claro, tocando 4/4 em colcheias"
  settings_rows:
    - ["Modo escuro", "Tema claro ou escuro"]
    - ["Salvar o BPM, o compasso e a divisão rítmica", "Restaura tudo na próxima abertura (ligado por padrão)"]
    - ["Aumento automático de BPM", "Próxima indicação de andamento a cada intervalo"]
    - ["Idioma", "English, Português (Brasil), Español, Français, Italiano; vale na próxima abertura"]
    - ["Saída", "O dispositivo de áudio onde tocar"]
  settings_alt_dark: "Configurações no tema escuro"
  settings_alt_light: "Configurações no tema claro"
  platforms_rows:
    - ["macOS", "14.4 ou posterior, Apple Silicon"]
    - ["Linux", "Um <code>.deb</code> para Debian e Ubuntu 24.04+, X11 e Wayland"]
    - ["Android", "Celulares e tablets arm64"]
